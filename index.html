<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f8fa">
<title>메모</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f8fa;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard",system-ui,sans-serif}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit}
#app{height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
.top h1{font-size:34px;letter-spacing:-1.5px;margin:0;font-weight:750}.top-actions{display:flex;align-items:center;gap:4px}.text-action{padding:8px 6px;color:#147ef5;font-size:15px}.bulk-bar{margin:0 16px 8px;padding:9px 10px;background:#e4e4e9;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:13px}.bulk-bar span{margin-right:auto}.bulk-bar button{padding:5px 9px;border-radius:7px;background:#fff;font-size:13px}.card{position:relative}.card.selected{background:#e9f2ff}.check-circle{position:absolute;right:14px;top:14px;width:23px;height:23px;border:1.5px solid #999;border-radius:50%;display:grid;place-items:center;font-size:14px}.card.selected .check-circle{background:#147ef5;border-color:#147ef5;color:#fff}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.icon svg,.fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.icon:active{background:#e9e9ec}
.folder-current{font-size:13px;color:#888;margin-top:2px}.folder-bar{margin:0 16px 8px;display:flex;align-items:center;gap:6px}.folder-bar select,.note-folder-row select{border:0;background:#e4e4e9;border-radius:9px;padding:7px 10px;font-size:14px;outline:0;min-width:0}.folder-bar button{width:36px;height:34px;border-radius:9px;display:grid;place-items:center;background:#e4e4e9}.folder-bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.note-folder-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;color:#888;font-size:13px}.note-folder-row select{background:#f0f0f3}.search{margin:0 16px 10px;background:#e4e4e9;border-radius:12px;height:38px;display:flex;align-items:center;padding:0 12px;gap:7px;flex:none}
.search span{display:grid;place-items:center;color:#777}.search span svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:16px;min-width:0}
.notes{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding:0 16px 110px}
.card{background:#fff;border-radius:14px;margin:7px 0;padding:15px 16px;box-shadow:0 1px 2px #00000008;cursor:pointer}
.card:active{background:#f1f1f3}
.card-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{font-size:15px;color:#666;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.card-meta{font-size:12px;color:#999;margin-top:9px;display:flex;gap:8px}
.empty{text-align:center;color:#888;padding:80px 20px;font-size:15px}
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:56px;height:56px;border-radius:50%;background:#ffcc00;display:grid;place-items:center;font-size:31px;color:#171717;box-shadow:0 5px 18px #0002;z-index:10}
.editor{background:#fff}
.editor-top{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;flex:none}
.back{font-size:17px;color:#147ef5;padding:9px 8px}
.editor-actions{display:flex;align-items:center;gap:3px}
.editor-actions button{width:40px;height:40px;border-radius:10px;font-size:20px}
.editor-actions button:active{background:#eee}
.save-state{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;color:#999;pointer-events:none}
.editor-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 18px calc(env(safe-area-inset-bottom) + 90px)}
.title-input{display:block;width:100%;border:0;outline:0;font-size:27px;font-weight:750;letter-spacing:-1px;margin:0 0 12px;padding:0;background:transparent;resize:none;line-height:1.2}
.body-editor{width:100%;min-height:55vh;outline:0;border:0;font-size:17px;line-height:1.65;letter-spacing:-.2px;word-break:break-word;caret-color:#147ef5}
.body-editor:empty:before{content:attr(data-placeholder);color:#aaa}
.body-editor img{display:block;max-width:100%;height:auto;border-radius:10px;margin:12px 0;user-select:none;-webkit-user-drag:none}
.body-editor div{min-height:1.65em}
.toolbar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:#f8f8f8eF;border-top:1px solid #ddd;display:flex;align-items:center;gap:6px;z-index:5;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.toolbar button,.file-label{width:44px;height:40px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:#333;cursor:pointer;-webkit-tap-highlight-color:transparent}
.toolbar button:active,.file-label:active{background:#ddd}
.toolbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#boldBtn svg path,#italicBtn svg path{fill:currentColor;stroke:none}
.file-label{position:relative}
#photoInput{display:none}
#photoInput{display:none}
.loading{position:fixed;inset:0;background:#fff8;backdrop-filter:blur(5px);z-index:100;display:none;place-items:center}
.loading.show{display:grid}
.spinner{width:34px;height:34px;border:3px solid #ddd;border-top-color:#147ef5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 85px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
@media (min-width:700px){body{background:#e9e9ed}.screen{max-width:700px;margin:auto;background:#f8f8fa}.editor{max-width:900px;width:100%;margin:auto}.toolbar{max-width:900px;margin:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'Everything';

const firebaseConfig = {
  apiKey: "AIzaSyDdHBd1HFYnoMdQQWbMogwrtxKYUO4dcVY",
  authDomain: "promotion-de29c.firebaseapp.com",
  projectId: "promotion-de29c",
  storageBucket: "promotion-de29c.firebasestorage.app",
  messagingSenderId: "855775584555",
  appId: "1:855775584555:web:66aa308ad010873c1ee56e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let notes = [];
let folders = [];
let currentFolderId = 'all';
let unsubscribe = null;
let currentNote = null;
let saveTimer = null;
let searchTerm = '';
let selectionMode = false;
let selectedIds = new Set();

const appEl = document.getElementById('app');
const loading = document.getElementById('loading');
const toastEl = document.getElementById('toast');

function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1500)}
function setLoading(v){loading.classList.toggle('show',v)}
function plainText(html=''){const d=document.createElement('div');d.innerHTML=html;return d.textContent?.replace(/\s+/g,' ').trim()||''}
function dateText(ts){
  const d=ts?.toDate?ts.toDate():new Date(ts||Date.now());
  const now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
}
function titleFor(n){return n.title?.trim() || plainText(n.content).slice(0,35) || '새로운 메모'}
function folderName(id){return folders.find(f=>f.id===id)?.name||'기본 폴더'}
async function createFolder(){
  const name=prompt('폴더 이름을 입력하세요.');
  if(!name?.trim())return;
  try{
    const ref=await addDoc(collection(db,'folders'),{name:name.trim(),createdAt:serverTimestamp()});
    currentFolderId=ref.id;
    renderList();
  }catch(e){console.error(e);toast('폴더를 만들지 못했어요');}
}
async function deleteFolder(id){
  if(!id||id==='all')return;
  const f=folders.find(x=>x.id===id);
  if(!f)return;
  if(!confirm(`'${f.name}' 폴더를 삭제할까요? 메모는 삭제되지 않아요.`))return;
  try{
    const targets=notes.filter(n=>n.folderId===id);
    for(const n of targets)await updateDoc(doc(db,'notes',n.id),{folderId:null,updatedAt:serverTimestamp()});
    await deleteDoc(doc(db,'folders',id));
    currentFolderId='all';renderList();
  }catch(e){console.error(e);toast('폴더를 삭제하지 못했어요');}
}

function renderList(){
  const filtered=notes.filter(n=>{
    const inFolder=currentFolderId==='all'||n.folderId===currentFolderId;
    if(!inFolder)return false;
    if(!searchTerm)return true;
    return (n.title||'').toLowerCase().includes(searchTerm.toLowerCase()) || plainText(n.content).toLowerCase().includes(searchTerm.toLowerCase());
  });
  const folderLabel=currentFolderId==='all'?'모든 메모':folderName(currentFolderId);
  appEl.innerHTML=`
  <main class="screen">
    <header class="top"><div><h1>메모</h1><div class="folder-current">${esc(folderLabel)}</div></div><button class="icon" id="newBtn" aria-label="새 메모" title="새 메모"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header>
    <div class="folder-bar">
      <select id="folderSelect" aria-label="메모 폴더">${`<option value="all" ${currentFolderId==='all'?'selected':''}>모든 메모</option>`}${folders.map(f=>`<option value="${f.id}" ${currentFolderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      <button id="addFolderBtn" aria-label="폴더 추가" title="폴더 추가"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="M12 10v5M9.5 12.5h5"/></svg></button>
      ${currentFolderId!=='all'?'<button id="deleteFolderBtn" aria-label="현재 폴더 삭제" title="현재 폴더 삭제"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 10v7M12 10v7M16 10v7M7 7l1 13h8l1-13"/></svg></button>':''}
    </div>
    <div class="search"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg></span><input id="searchInput" value="${esc(searchTerm)}" placeholder="검색" autocomplete="off" inputmode="search"></div>
    <section class="notes">
      ${filtered.length?filtered.map(n=>`
        <article class="card" data-id="${n.id}">
          <div class="card-title">${esc(titleFor(n))}</div>
          <div class="card-body">${esc(plainText(n.content)||'내용 없음')}</div>
          <div class="card-meta">${n.pinned?'고정 · ':''}${dateText(n.updatedAt||n.createdAt)}${n.images?.length?' · 사진 '+n.images.length:''}</div>
        </article>`).join(''):'<div class="empty">아직 메모가 없어요.<br>오른쪽 위 +를 눌러 새 메모를 작성해보세요.</div>'}
    </section>
    <button class="fab" id="fab" aria-label="새 메모" title="새 메모"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </main>`;
  document.getElementById('newBtn').onclick=createNote;
  document.getElementById('fab').onclick=createNote;
  document.getElementById('addFolderBtn').onclick=createFolder;
  document.getElementById('deleteFolderBtn')?.addEventListener('click',()=>deleteFolder(currentFolderId));
  document.getElementById('folderSelect').onchange=e=>{currentFolderId=e.target.value;renderList()};
  document.getElementById('searchInput').oninput=e=>{searchTerm=e.target.value;renderList();document.getElementById('searchInput')?.focus()};
  document.querySelectorAll('.card').forEach(el=>el.onclick=()=>openNote(el.dataset.id));
}
function editorHTML(n){
  appEl.innerHTML=`
  <main class="screen editor">
    <header class="editor-top">
      <button class="back" id="backBtn">‹ 메모</button>
      <div class="save-state" id="saveState">저장됨</div>
      <div class="editor-actions">
        <button id="pinBtn" title="고정">${n.pinned?'📌':'📍'}</button>
        <button id="deleteBtn" title="삭제">🗑</button>
      </div>
    </header>
    <section class="editor-scroll" id="editorScroll">
      <div class="note-folder-row"><span>폴더</span><select id="noteFolderSelect"><option value="none">기본 폴더</option>${folders.map(f=>`<option value="${f.id}" ${n.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div>
      <input id="titleInput" class="title-input" value="${esc(n.title||'')}" placeholder="제목" autocomplete="off" enterkeyhint="next">
      <div id="bodyEditor" class="body-editor" contenteditable="true" spellcheck="true" data-placeholder="내용을 입력하세요.">${n.content||''}</div>
    </section>
    <nav class="toolbar" id="toolbar" aria-label="편집 도구">
      <button id="boldBtn" aria-label="굵게" title="굵게"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h6a4 4 0 0 1 1.7 7.62A4 4 0 0 1 13 20H7V5Zm3 3v4h3a2 2 0 1 0 0-4h-3Zm0 7v2h3a2 2 0 1 0 0-2h-3Z"/></svg></button>
      <button id="italicBtn" aria-label="기울임" title="기울임"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5h8v3h-2.4l-3.2 8H15v3H7v-3h2.4l3.2-8H10V5Z"/></svg></button>
      <button id="checkBtn" aria-label="체크리스트" title="체크리스트"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg></button>
      <label class="file-label" aria-label="사진 추가" title="사진 추가"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3.5 3 2.5-2.5 3.5 4"/></svg><input id="photoInput" type="file" accept="image/*" multiple></label>
    </nav>
  </main>`;
  document.getElementById('backBtn').onclick=closeEditor;
  document.getElementById('pinBtn').onclick=togglePin;
  document.getElementById('deleteBtn').onclick=removeCurrent;
  const folderSelect=document.getElementById('noteFolderSelect');
  if(folderSelect)folderSelect.onchange=e=>{currentNote.folderId=e.target.value==='none'?null:e.target.value;scheduleSave()};
  document.getElementById('titleInput').oninput=scheduleSave;
  const body=document.getElementById('bodyEditor');
  body.oninput=scheduleSave;
  document.getElementById('boldBtn').onclick=()=>document.execCommand('bold');
  document.getElementById('italicBtn').onclick=()=>document.execCommand('italic');
  document.getElementById('checkBtn').onclick=()=>document.execCommand('insertText',false,'☐ ');
  document.getElementById('photoInput').onchange=uploadImages;
  body.addEventListener('paste',e=>{
    const items=[...(e.clipboardData?.items||[])];
    const image=items.find(i=>i.type.startsWith('image/'));
    if(image){e.preventDefault();uploadBlob(image.getAsFile());}
  });
  setTimeout(()=>document.getElementById('titleInput').focus(),50);
}

function createNote(){
  currentNote={id:null,title:'',content:'',pinned:false,images:[],folderId:currentFolderId==='all'?null:currentFolderId,createdAt:new Date(),updatedAt:new Date()};
  editorHTML(currentNote);
}
function openNote(id){
  const n=notes.find(x=>x.id===id); if(!n)return;
  currentNote=JSON.parse(JSON.stringify(n));
  editorHTML(currentNote);
}
function closeEditor(){
  clearTimeout(saveTimer);
  saveNow().finally(()=>{currentNote=null;renderList()});
}
async function saveNow(){
  if(!currentNote)return;
  const title=document.getElementById('titleInput')?.value ?? currentNote.title;
  const content=document.getElementById('bodyEditor')?.innerHTML ?? currentNote.content;
  currentNote.title=title;currentNote.content=content;
  const data={title,content,pinned:!!currentNote.pinned,images:currentNote.images||[],folderId:currentNote.folderId||null,updatedAt:serverTimestamp()};
  try{
    const state=document.getElementById('saveState');
    if(state)state.textContent='저장 중…';
    if(currentNote.id){
      await updateDoc(doc(db,'notes',currentNote.id),data);
      const i=notes.findIndex(n=>n.id===currentNote.id);
      if(i>=0)notes[i]={...notes[i],title,content,pinned:!!currentNote.pinned,images:currentNote.images||[],folderId:currentNote.folderId||null,updatedAt:new Date()};
    }else{
      data.createdAt=serverTimestamp();
      const ref=await addDoc(collection(db,'notes'),data);
      currentNote.id=ref.id;
      notes.unshift({id:ref.id,title,content,pinned:!!currentNote.pinned,images:currentNote.images||[],folderId:currentNote.folderId||null,createdAt:new Date(),updatedAt:new Date()});
    }
    if(state)state.textContent='저장됨';
  }catch(e){console.error(e);toast('저장에 실패했어요');}
}
function scheduleSave(){
  const s=document.getElementById('saveState');if(s)s.textContent='작성 중…';
  clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,650);
}
async function togglePin(){
  currentNote.pinned=!currentNote.pinned;
  document.getElementById('pinBtn').textContent=currentNote.pinned?'📌':'📍';
  await saveNow();
}
async function removeCurrent(){
  if(!currentNote)return;
  if(!confirm('이 메모를 삭제할까요?'))return;
  clearTimeout(saveTimer);
  if(currentNote.id)await deleteDoc(doc(db,'notes',currentNote.id));
  currentNote=null;renderList();
}
async function uploadBlob(file){
  if(!file)return;
  if(!file.type.startsWith('image/'))return;
  setLoading(true);
  try{
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);fd.append('folder','memo');
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
    if(!res.ok)throw new Error(await res.text());
    const data=await res.json();
    const body=document.getElementById('bodyEditor');
    body.focus();
    document.execCommand('insertHTML',false,`<img src="${data.secure_url}" alt="사진" loading="lazy"><br>`);
    currentNote.images=[...(currentNote.images||[]),data.secure_url];
    scheduleSave();
  }catch(e){console.error(e);toast('사진 업로드에 실패했어요');}
  finally{setLoading(false)}
}
async function uploadImages(e){
  const files=[...e.target.files];e.target.value='';
  for(const f of files)await uploadBlob(f);
}

setLoading(false);

onSnapshot(query(collection(db,'notes'),orderBy('updatedAt','desc')),snap=>{
  notes=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderList();
},err=>{
  console.error('notes listener:',err);
  toast('메모 목록을 불러오지 못했어요');
});

onSnapshot(query(collection(db,'folders'),orderBy('createdAt','asc')),snap=>{
  folders=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderList();
},err=>{
  console.error('folders listener:',err);
});

renderList();

</script>
</body>
</html>
