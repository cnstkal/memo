<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f8fa;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard",system-ui,sans-serif}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit}
#app{height:100dvh;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
.top h1{font-size:34px;letter-spacing:-1.5px;margin:0;font-weight:750}.top-actions{display:flex;align-items:center;gap:4px}.text-action{padding:8px 6px;color:#147ef5;font-size:15px}.bulk-bar{margin:0 16px 8px;padding:9px 10px;background:#e4e4e9;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:13px}.bulk-bar span{margin-right:auto}.bulk-bar button{padding:5px 9px;border-radius:7px;background:#fff;font-size:13px}.card{position:relative}.card.selected{background:#e9f2ff}.check-circle{position:absolute;right:14px;top:14px;width:23px;height:23px;border:1.5px solid #999;border-radius:50%;display:grid;place-items:center;font-size:14px}.card.selected .check-circle{background:#147ef5;border-color:#147ef5;color:#fff}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.icon svg,.fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.icon:active{background:#e9e9ec}
.folder-current{font-size:13px;color:#888;margin-top:2px}.folder-bar{margin:0 16px 8px;display:flex;align-items:center;gap:6px}.folder-bar select,.note-folder-row select{border:0;background:#e4e4e9;border-radius:9px;padding:7px 10px;font-size:14px;outline:0;min-width:0}.folder-bar button{width:36px;height:34px;border-radius:9px;display:grid;place-items:center;background:#e4e4e9}.folder-bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.note-folder-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;color:#888;font-size:13px}.note-folder-row select{background:#f0f0f3}.search{margin:0 16px 10px;background:#e4e4e9;border-radius:12px;height:38px;display:flex;align-items:center;padding:0 12px;gap:7px;flex:none}
.search span{display:grid;place-items:center;color:#777}.search span svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:16px;min-width:0}
.notes{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding:0 16px 110px}
.card{background:#fff;border-radius:14px;margin:7px 0;padding:15px 16px;box-shadow:0 1px 2px #00000008;cursor:pointer}
.card:active{background:#f1f1f3}
.card-row{display:flex;align-items:center;gap:12px}.card-main{flex:1;min-width:0}.thumb{flex:none;width:56px;height:56px;border-radius:9px;object-fit:cover;background:#e4e4e9}.card.sel-mode .thumb{margin-right:34px}.card.sel-mode .card-main{padding-right:0}[data-theme=dark] .thumb{background:#2c2c2e}
.card-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{font-size:15px;color:#666;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.card-meta{font-size:12px;color:#999;margin-top:9px;display:flex;gap:8px}
.empty{text-align:center;color:#888;padding:80px 20px;font-size:15px}
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:56px;height:56px;border-radius:50%;background:#ffcc00;display:grid;place-items:center;font-size:31px;color:#171717;box-shadow:0 5px 18px #0002;z-index:10}
.editor{background:#fff}
.editor-top{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;flex:none}
.back{font-size:17px;color:#147ef5;padding:9px 8px}
.editor-actions{display:flex;align-items:center;gap:3px}
.editor-actions button{width:40px;height:40px;border-radius:10px;font-size:20px}
.editor-actions button:active{background:#eee}
.save-state{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;color:#999;pointer-events:none}
.editor-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 18px calc(env(safe-area-inset-bottom) + 90px)}
.title-input{display:block;width:100%;border:0;outline:0;font-size:27px;font-weight:750;letter-spacing:-1px;margin:0 0 12px;padding:0;background:transparent;resize:none;line-height:1.2}
.body-editor{width:100%;min-height:55vh;outline:0;border:0;font-size:17px;line-height:1.65;letter-spacing:-.2px;word-break:break-word;caret-color:#147ef5}
.body-editor:empty:before{content:attr(data-placeholder);color:#aaa}

.body-editor div{min-height:1.65em}
.toolbar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:#f8f8f8eF;border-top:1px solid #ddd;display:flex;align-items:center;gap:6px;z-index:50;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);transform:translateY(0);will-change:transform}
.toolbar button,.file-label{width:44px;height:40px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:#333;cursor:pointer;-webkit-tap-highlight-color:transparent}
.toolbar button:active,.file-label:active{background:#ddd}
.toolbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#boldBtn svg path,#italicBtn svg path{fill:currentColor;stroke:none}
.file-label{position:relative}
#photoInput{display:none}
#photoInput{display:none}
.loading{position:fixed;inset:0;background:#fff8;backdrop-filter:blur(5px);z-index:100;display:none;place-items:center}
.loading.show{display:grid}
.spinner{width:34px;height:34px;border:3px solid #ddd;border-top-color:#147ef5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 85px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
@media (min-width:700px){body{background:#e9e9ed}.screen{max-width:700px;margin:auto;background:#f8f8fa}.editor{max-width:900px;width:100%;margin:auto}.toolbar{max-width:900px;margin:auto}}

.body-editor img{display:inline-block;vertical-align:top;width:100%;max-width:100%;height:auto;border-radius:10px;margin:6px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;touch-action:manipulation}
.body-editor img.small{width:auto;height:130px;max-width:calc(100% - 6px);margin:3px 6px 3px 0;border-radius:8px}
.body-editor img.sel{outline:3px solid #147ef5;outline-offset:-3px}
.img-menu{position:fixed;z-index:300;display:flex;gap:2px;background:#222;border-radius:12px;padding:4px;box-shadow:0 6px 20px #0004}
.img-menu button{color:#fff;font-size:14px;padding:9px 14px;border-radius:9px}
.img-menu button:active{background:#444}
.img-menu .danger{color:#ff6b6b}
.card.selected .card-title{color:#147ef5}
.editor-top{position:fixed;top:0;left:0;right:0;background:#fff;z-index:60}
.editor-top button{touch-action:manipulation}
.editor-scroll{padding-top:calc(env(safe-area-inset-top) + 72px)!important}
.body-editor img[data-uploading]{opacity:.55}
@media (min-width:700px){.editor-top{max-width:900px;margin:auto}}

input,textarea,select{color:inherit}

:root[data-theme=dark] html{background:#000}
[data-theme=dark] .text-action,[data-theme=dark] .back{color:#4da3ff}
[data-theme=dark] .icon:active{background:#2c2c2e}
[data-theme=dark] .bulk-bar,[data-theme=dark] .folder-bar select,[data-theme=dark] .folder-bar button,[data-theme=dark] .search,[data-theme=dark] .note-folder-row select{background:#2c2c2e;color:#f2f2f2}
[data-theme=dark] .bulk-bar button{background:#3a3a3c;color:#f2f2f2}
[data-theme=dark] .card{background:#1c1c1e;box-shadow:none}
[data-theme=dark] .card:active{background:#2a2a2c}
[data-theme=dark] .card.selected{background:#16314f}
[data-theme=dark] .card.selected .card-title{color:#6db5ff}
[data-theme=dark] .check-circle{border-color:#777}
[data-theme=dark] .card-body{color:#aaa}
[data-theme=dark] .card-meta,[data-theme=dark] .folder-current,[data-theme=dark] .empty,[data-theme=dark] .note-folder-row,[data-theme=dark] .search span{color:#8e8e93}
[data-theme=dark] .editor,[data-theme=dark] .editor-top{background:#000}
[data-theme=dark] .editor-top{border-bottom-color:#222}
[data-theme=dark] .editor-actions button:active{background:#2c2c2e}
[data-theme=dark] .title-input,[data-theme=dark] .body-editor{color:#f2f2f2}
[data-theme=dark] .body-editor:empty:before,[data-theme=dark] ::placeholder{color:#666}
[data-theme=dark] .body-editor{caret-color:#4da3ff}
[data-theme=dark] .save-state{color:#777}
[data-theme=dark] .toolbar{background:#1c1c1eef;border-top-color:#333}
[data-theme=dark] .toolbar button,[data-theme=dark] .file-label{color:#ddd}
[data-theme=dark] .toolbar button:active,[data-theme=dark] .file-label:active{background:#3a3a3c}
[data-theme=dark] .loading{background:#0008}
[data-theme=dark] .spinner{border-color:#444;border-top-color:#4da3ff}
[data-theme=dark] .toast{background:#3a3a3c}
@media (min-width:700px){[data-theme=dark] body{background:#000}[data-theme=dark] .screen{background:#000}}
.screen.trash{background:#fff1ef}
.screen.trash .top h1{color:#d93025}
.screen.trash .folder-current{color:#d93025;font-weight:600}
.trash-banner{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:#ffd9d4;color:#8a1c12;font-size:13px;line-height:1.45;display:flex;align-items:center;gap:10px}
.trash-banner span{flex:1}
.trash-banner button{padding:7px 11px;border-radius:9px;background:#d93025;color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.bulk-bar .danger-btn{background:#d93025;color:#fff}
.screen.trash .card{border:1px solid #f3c9c4}
.screen.trash .card-title{color:#8a1c12}
:root[data-theme=dark] .screen.trash{background:#1a0b0a}
:root[data-theme=dark] .screen.trash .top h1,:root[data-theme=dark] .screen.trash .folder-current{color:#ff6b5e}
:root[data-theme=dark] .trash-banner{background:#3a1512;color:#ffb4ab}
:root[data-theme=dark] .screen.trash .card{border-color:#4a1f1b}

@media (min-width:700px){:root[data-theme=dark] .screen.trash{background:#1a0b0a}}
</style>

<body>
<div id="app"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, setDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const CLOUDINARY_CLOUD='dbljkloal';
const CLOUDINARY_PRESET='Everything';
const firebaseConfig={
  apiKey:"AIzaSyDdHBd1HFYnoMdQQWbMogwrtxKYUO4dcVY",
  authDomain:"promotion-de29c.firebaseapp.com",
  projectId:"promotion-de29c",
  storageBucket:"promotion-de29c.firebasestorage.app",
  messagingSenderId:"855775584555",
  appId:"1:855775584555:web:66aa308ad010873c1ee56e"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let notes=[],folders=[];
let currentFolderId='all',currentNote=null,saveTimer=null,searchTerm='';
let selectionMode=false,selectedIds=new Set(),editorOpen=false,trashMode=false;
let savedRange=null,menuImg=null;

function getTheme(){
  let t=null;try{t=localStorage.getItem('memoTheme')}catch{}
  return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',t==='dark'?'#000000':'#f8f8fa');
}
applyTheme(getTheme());
const appEl=document.getElementById('app');
const loading=document.getElementById('loading');
const toastEl=document.getElementById('toast');
let toastTimer=null;

const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
function setLoading(v){loading.classList.toggle('show',v)}
function plainText(html=''){const d=document.createElement('div');d.innerHTML=html;return d.textContent?.replace(/\s+/g,' ').trim()||''}
function ms(ts){if(!ts)return Date.now();if(ts.toMillis)return ts.toMillis();if(ts instanceof Date)return ts.getTime();return Number(ts)||Date.now()}
function dateText(ts){
  const d=new Date(ms(ts));const now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
}
function firstLine(html=''){
  const t=String(html).replace(/<\/(div|p|li|h[1-6])>|<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'');
  const d=document.createElement('textarea');d.innerHTML=t;   // 엔티티 풀기
  const line=d.value.split('\n').map(x=>x.replace(/[\u200b\u00a0]/g,' ').trim()).find(Boolean);
  return (line||'').slice(0,100);
}
function previewFor(n){
  const html=n.content||'';
  const t=(n.title||'').trim();
  // 예전 메모(제목이 따로 저장된 것)는 본문 전체를 보여줌
  if(t&&firstLine(html)!==t)return plainText(html);
  const txt=html.replace(/<\/(div|p|li|h[1-6])>|<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'');
  const d=document.createElement('textarea');d.innerHTML=txt;
  const lines=d.value.split('\n').map(x=>x.replace(/[\u200b\u00a0]/g,' ').trim());
  const i=lines.findIndex(Boolean);
  return lines.slice(i+1).filter(Boolean).join(' ');   // 제목(첫 줄)은 빼고
}
function titleFor(n){return n.title?.trim()||firstLine(n.content)||(n.images?.length?'사진':'새로운 메모')}
function folderName(id){return folders.find(f=>f.id===id)?.name||'기본 폴더'}

/* ---------- 폴더 ---------- */
async function createFolder(){
  const name=prompt('폴더 이름을 입력하세요.');
  if(!name?.trim())return;
  try{
    const ref=doc(collection(db,'folders'));
    folders.push({id:ref.id,name:name.trim(),createdAt:new Date()});
    currentFolderId=ref.id;renderList();
    await setDoc(ref,{name:name.trim(),createdAt:serverTimestamp()});
  }catch(e){console.error(e);toast('폴더를 만들지 못했어요')}
}
async function deleteFolder(id){
  if(!id||id==='all')return;
  const f=folders.find(x=>x.id===id);if(!f)return;
  if(!confirm(`'${f.name}' 폴더를 삭제할까요? 메모는 삭제되지 않아요.`))return;
  try{
    const targets=notes.filter(n=>n.folderId===id);
    targets.forEach(n=>n.folderId=null);
    folders=folders.filter(x=>x.id!==id);
    currentFolderId='all';renderList();
    await Promise.all(targets.map(n=>setDoc(doc(db,'notes',n.id),{folderId:null,updatedAt:serverTimestamp()},{merge:true})));
    await deleteDoc(doc(db,'folders',id));
  }catch(e){console.error(e);toast('폴더를 삭제하지 못했어요')}
}

/* ---------- 일괄 작업 ---------- */
function exitSelection(){selectedIds.clear();selectionMode=trashMode;}
async function bulkDelete(){
  if(!selectedIds.size)return;
  if(!confirm(selectedIds.size+'개의 메모를 휴지통으로 이동할까요?'))return;
  const ids=[...selectedIds];
  ids.forEach(id=>{const n=notes.find(x=>x.id===id);if(n)n.deletedAt=new Date()});
  exitSelection();selectionMode=false;renderList();
  try{await Promise.all(ids.map(id=>setDoc(doc(db,'notes',id),{deletedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true})))}
  catch(e){console.error(e);toast('휴지통 이동에 실패했어요')}
}
async function bulkRestore(){
  if(!selectedIds.size)return;
  const ids=[...selectedIds];
  ids.forEach(id=>{const n=notes.find(x=>x.id===id);if(n)n.deletedAt=null});
  exitSelection();renderList();
  try{await Promise.all(ids.map(id=>setDoc(doc(db,'notes',id),{deletedAt:null,updatedAt:serverTimestamp()},{merge:true})));toast('복구했어요')}
  catch(e){console.error(e);toast('복구에 실패했어요')}
}
async function bulkPurge(){
  if(!selectedIds.size)return;
  if(!confirm('선택한 메모 '+selectedIds.size+'개를 영구 삭제할까요?\n되돌릴 수 없어요.'))return;
  const ids=[...selectedIds];
  notes=notes.filter(n=>!ids.includes(n.id));
  exitSelection();renderList();
  try{await Promise.all(ids.map(id=>deleteDoc(doc(db,'notes',id))))}
  catch(e){console.error(e);toast('삭제에 실패했어요')}
}
async function emptyTrash(){
  const ids=filteredNotes().map(n=>n.id);if(!ids.length)return;
  if(!confirm('휴지통의 메모 '+ids.length+'개를 모두 영구 삭제할까요?\n되돌릴 수 없어요.'))return;
  notes=notes.filter(n=>!ids.includes(n.id));selectedIds.clear();renderList();
  try{await Promise.all(ids.map(id=>deleteDoc(doc(db,'notes',id))));toast('휴지통을 비웠어요')}
  catch(e){console.error(e);toast('삭제에 실패했어요')}
}
async function bulkMove(){
  if(!selectedIds.size)return;
  const options=[{id:'none',name:'기본 폴더'},...folders];
  const answer=prompt('이동할 폴더 번호를 입력하세요.\n'+options.map((x,i)=>(i+1)+'. '+x.name).join('\n'));
  const index=Number(answer)-1;
  if(!Number.isInteger(index)||!options[index])return;
  const fid=options[index].id==='none'?null:options[index].id;
  const ids=[...selectedIds];
  ids.forEach(id=>{const n=notes.find(x=>x.id===id);if(n)n.folderId=fid});
  exitSelection();selectionMode=false;renderList();
  try{await Promise.all(ids.map(id=>setDoc(doc(db,'notes',id),{folderId:fid,updatedAt:serverTimestamp()},{merge:true})))}
  catch(e){console.error(e);toast('폴더 이동에 실패했어요')}
}

/* ---------- 목록 ---------- */
function filteredNotes(){
  const q=searchTerm.toLowerCase();
  return notes.filter(n=>{
    if(trashMode?!n.deletedAt:!!n.deletedAt)return false;
    if(!trashMode&&currentFolderId!=='all'&&n.folderId!==currentFolderId)return false;
    if(!q)return true;
    return (n.title||'').toLowerCase().includes(q)||plainText(n.content).toLowerCase().includes(q);
  }).sort((a,b)=>(trashMode?0:(!!b.pinned-!!a.pinned))||(ms(b.updatedAt||b.createdAt)-ms(a.updatedAt||a.createdAt)));
}
function bulkHTML(){
  if(!selectionMode||!selectedIds.size)return '';
  return trashMode
    ?`<div class="bulk-bar"><span>${selectedIds.size}개 선택됨</span><button id="restoreBtn">복구</button><button id="purgeBtn" class="danger-btn">삭제 (영구)</button></div>`
    :`<div class="bulk-bar"><span>${selectedIds.size}개 선택됨</span><button id="moveBtn">폴더 이동</button><button id="bulkDeleteBtn">삭제</button></div>`;
}
function cardsHTML(){
  const list=filteredNotes();
  if(!list.length)return `<div class="empty">${trashMode?'휴지통이 비어 있어요.':'아직 메모가 없어요.<br>오른쪽 위 +를 눌러 새 메모를 작성해보세요.'}</div>`;
  return list.map(n=>{
    const th=thumbFor(n);
    return `
    <article class="card ${selectedIds.has(n.id)?'selected':''}${selectionMode?' sel-mode':''}" data-id="${n.id}">
      ${selectionMode?`<span class="check-circle">${selectedIds.has(n.id)?'✓':''}</span>`:''}
      <div class="card-row">
        <div class="card-main">
          <div class="card-title">${esc(titleFor(n))}</div>

/* ---------- 사진과 글자는 한 줄에 같이 있지 못하게 ---------- */
function normalizeLines(body){
  if(!body)return;
  const sel=getSelection();let an=null,ao=0;
  if(sel&&sel.rangeCount&&body.contains(sel.anchorNode)){an=sel.anchorNode;ao=sel.anchorOffset}
  const isImg=c=>c.nodeType===1&&c.tagName==='IMG';
  const isBlank=c=>(c.nodeType===3&&!c.nodeValue.replace(/[\u200b\s]/g,''))||(c.nodeType===1&&c.tagName==='BR');
  const mixed=el=>{
    let img=false,oth=false;
    for(const c of el.childNodes){
      if(isImg(c))img=true;
      else if(isBlank(c))continue;
      else if(c.nodeType===1&&c.tagName==='DIV'&&el===body)continue; // 이미 줄로 나뉜 div는 그대로
      else oth=true;
    }
    return img&&oth;
  };
  const split=el=>{
    const runs=[];let cur=null;
    for(const c of [...el.childNodes]){
      const kind=isImg(c)?'img':(isBlank(c)&&cur?cur.kind:'txt');
      if(!cur||cur.kind!==kind){cur={kind,nodes:[]};runs.push(cur)}
      cur.nodes.push(c);
    }
    return runs.map(r=>{
      const d=document.createElement('div');
      r.nodes.forEach(n=>{if(r.kind==='img'&&n.nodeType===1&&n.tagName==='BR')return;d.appendChild(n)});
      if(!d.childNodes.length)d.innerHTML='<br>';
      return d;
    });
  };
  let changed=false;
  if(mixed(body)){
    // body 바로 아래에 섞여 있는 경우: div 줄로 감싸되 이미 있는 div는 유지
    const out=[];let buf=[];
    const flushBuf=()=>{if(!buf.length)return;const tmp=document.createElement('div');buf.forEach(n=>tmp.appendChild(n));out.push(...split(tmp));buf=[]};
    for(const c of [...body.childNodes]){
      if(c.nodeType===1&&c.tagName==='DIV'){flushBuf();out.push(c)}else buf.push(c);
    }
    flushBuf();
    body.innerHTML='';out.forEach(d=>body.appendChild(d));changed=true;
  }
  for(const el of [...body.querySelectorAll(':scope > div')]){
    if(mixed(el)){
      const ds=split(el);ds.forEach(d=>body.insertBefore(d,el));el.remove();changed=true;
    }
  }
  if(changed&&an&&an.isConnected){
    try{
      const r=document.createRange();
      const max=an.nodeType===3?an.nodeValue.length:an.childNodes.length;
      r.setStart(an,Math.min(ao,max));r.collapse(true);
      sel.removeAllRanges();sel.addRange(r);
    }catch{}
  }
}
// 사진 줄에서 글자를 치려고 하면, 사진 아래(또는 위) 새 줄로 커서를 옮김
function guardImageLine(body,e){
  if(!/^insert(Text|CompositionText|ReplacementText|FromPaste|FromDrop)$/.test(e.inputType||''))return;
  const sel=getSelection();if(!sel.rangeCount)return;
  const r=sel.getRangeAt(0);if(!r.collapsed)return;
  let line=r.startContainer;
  if(line===body){
    const ref=body.childNodes[r.startOffset-1]||body.childNodes[r.startOffset];
    if(ref&&ref.nodeType===1&&ref.tagName==='IMG')line=ref;else return;
  }else{
    while(line&&line.parentNode!==body)line=line.parentNode;
    if(!line||line.nodeType!==1)return;
  }
  const imgs=line.tagName==='IMG'?[line]:[...line.childNodes].filter(c=>c.nodeType===1&&c.tagName==='IMG');
  if(!imgs.length)return;
  const hasText=line.tagName!=='IMG'&&[...line.childNodes].some(c=>(c.nodeType===3&&c.nodeValue.replace(/[\u200b\s]/g,''))||(c.nodeType===1&&c.tagName!=='IMG'&&c.tagName!=='BR'));
  if(hasText)return;   // 글자 줄이면 normalize가 처리
  // 커서 앞에 사진이 있는지
  let after=false;
  for(const im of imgs){
    const rr=document.createRange();rr.setStartAfter(im);rr.collapse(true);
    if(r.compareBoundaryPoints(Range.START_TO_START,rr)>=0)after=true;
  }
  const nd=document.createElement('div');nd.innerHTML='<br>';
  if(after)line.parentNode.insertBefore(nd,line.nextSibling);else line.parentNode.insertBefore(nd,line);
  const nr=document.createRange();nr.setStart(nd,0);nr.collapse(true);
  sel.removeAllRanges();sel.addRange(nr);
}

function setupImageLongPress(body){
  let timer=null,sx=0,sy=0,target=null;
  const cancel=()=>{clearTimeout(timer);timer=null;target=null};
  const start=(img,x,y)=>{
    sx=x;sy=y;target=img;clearTimeout(timer);
    timer=setTimeout(()=>{
      timer=null;
      try{getSelection().removeAllRanges()}catch{}
      showImgMenu(target);
    },420);
  };
  // 터치(아이폰/안드로이드): pointercancel이 먼저 터져서 타이머가 죽는 문제를 피하려고 touch 이벤트 사용
  body.addEventListener('touchstart',e=>{
    const img=e.target.closest?.('img');
    if(!img){hideImgMenu();return}
    const t=e.touches[0];start(img,t.clientX,t.clientY);
  },{passive:true});
  body.addEventListener('touchmove',e=>{
    if(!timer)return;const t=e.touches[0];
    if(Math.hypot(t.clientX-sx,t.clientY-sy)>12)cancel();
  },{passive:true});
  body.addEventListener('touchend',()=>{
    const wasLong=!timer&&menuImg;cancel();
  },{passive:true});
  // 마우스(PC)
  body.addEventListener('mousedown',e=>{
    if(e.sourceCapabilities?.firesTouchEvents)return;
    const img=e.target.closest?.('img');if(!img){hideImgMenu();return}
    start(img,e.clientX,e.clientY);
  });
  body.addEventListener('mousemove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)cancel()});
  body.addEventListener('mouseup',cancel);
  body.addEventListener('contextmenu',e=>{if(e.target.closest('img')){e.preventDefault();if(!menuImg)showImgMenu(e.target.closest('img'))}});
  body.addEventListener('dragstart',e=>{if(e.target.closest('img'))e.preventDefault()});
  document.getElementById('editorScroll').addEventListener('scroll',()=>{cancel();hideImgMenu()},{passive:true});
}

function insertImage(url,uploading){
  const body=document.getElementById('bodyEditor');if(!body)return null;
  const img=document.createElement('img');img.src=url;img.alt='사진';
  if(uploading)img.setAttribute('data-uploading','1');
  let range;
  if(savedRange&&body.contains(savedRange.startContainer))range=savedRange.cloneRange();
  else{range=document.createRange();range.selectNodeContents(body);range.collapse(false)}
  range.deleteContents();
  let prev=null;
  const c=range.startContainer,o=range.startOffset;
  if(c.nodeType===3&&o===0)prev=c.previousSibling;
  else if(c.nodeType===1)prev=c.childNodes[o-1]||null;
  if(c.nodeType===3&&o>0&&!c.textContent.slice(0,o).trim())prev=c.previousSibling;
  img.classList.add('small');   // 기본은 작게
  range.insertNode(img);
  normalizeLines(body);             // 사진은 글자와 다른 줄에 두기
  const ln=img.parentNode===body?img:img.parentNode;
  if(ln&&ln.parentNode===body&&!ln.nextSibling){const d=document.createElement('div');d.innerHTML='<br>';body.appendChild(d)}
  const r=document.createRange();r.setStartAfter(img);r.collapse(true);
  savedRange=r;
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  return img;
}
// 업로드 전에 긴 변 1600px, JPEG로 줄여서 용량/시간 절약
async function shrink(file){
  const LIMIT=9.5*1024*1024;   // 업로드 서버 한도(보통 10MB) 아래로 맞춤
  try{
    // 작은 파일은 그대로 (GIF도 한도 안이면 움짤 유지)
    if(file.size<300*1024||(file.type==='image/gif'&&file.size<LIMIT))return file;
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    // 용량이 한도 안에 들어올 때까지 크기/화질을 단계적으로 낮춤
    const steps=[[1600,.82],[1280,.72],[1024,.62],[800,.5],[600,.4]];
    let best=null;
    for(const [max,q] of steps){
      const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*sc));cv.height=Math.max(1,Math.round(bmp.height*sc));
      cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      if(!blob)continue;
      best=blob;
      if(blob.size<LIMIT&&(blob.size<file.size||file.size>=LIMIT))break;
    }
    bmp.close?.();
    if(best&&(best.size<file.size||file.size>=LIMIT)){
      if(file.type==='image/gif')toast('움짤이 너무 커서 정지 사진으로 올렸어요');
      return best;
    }
    return file;
  }catch(e){console.warn('shrink failed',e);return file}
}
async function cloudUpload(f){
  const fd=new FormData();
  if(typeof f==='string')fd.append('file',f);else fd.append('file',f,'photo.jpg');
  fd.append('upload_preset',CLOUDINARY_PRESET);fd.append('folder','memo');
  const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
  if(!res.ok)throw new Error(await res.text());
  return (await res.json()).secure_url;
}
// source: File/Blob 또는 이미지 주소(data:, http(s):)
async function processImage(img,source,noteId){
  try{
    let payload=source;
    if(typeof source==='string'&&source.startsWith('data:'))payload=await (await fetch(source)).blob();
    if(payload instanceof Blob)payload=await shrink(payload);
    const url=await cloudUpload(payload);
    if(img&&img.isConnected){
      img.src=url;img.removeAttribute('data-uploading');
      scheduleSave();
    }else if(editorOpen&&currentNote?.id===noteId&&document.getElementById('bodyEditor')){
      // 나갔다 다시 들어온 같은 메모가 열려 있으면: 편집기에 직접 넣어야 자동저장이 덮어쓰지 않음
      const body=document.getElementById('bodyEditor');
      const d=document.createElement('div');const im=document.createElement('img');
      im.src=url;im.alt='사진';im.className='small';d.appendChild(im);body.appendChild(d);
      scheduleSave();
    }else{
      // 업로드 중에 목록으로 나간 경우: 해당 메모 끝에 사진 추가
      let n=notes.find(x=>x.id===noteId);
      if(!n){n={id:noteId,title:'',content:'',images:[],pinned:false,folderId:null,deletedAt:null,createdAt:new Date(),updatedAt:new Date()};notes.push(n)}
      if(n){
        n.content=(n.content||'')+`<img class="small" src="${url}" alt="사진"><br>`;n.images=[...(n.images||[]),url];
        await setDoc(doc(db,'notes',noteId),{content:n.content,images:n.images,updatedAt:serverTimestamp()},{merge:true});
        if(!editorOpen)renderList();
      }
    }
  }catch(e){
    console.error(e);
    if(typeof source==='string'&&/^https?:/i.test(source)&&img?.isConnected){
      // 업로드는 실패했지만 원본 주소가 있으면 링크로라도 유지
      img.removeAttribute('data-uploading');scheduleSave();toast('사진을 원본 링크로 넣었어요');
    }else{
      toast('사진 업로드에 실패했어요');
      if(img?.isConnected)img.remove();
    }
  }
}
async function uploadBlob(file){
  if(!file||!file.type.startsWith('image/')||!currentNote)return;
  const noteId=currentNote.id;
  const preview=URL.createObjectURL(file);
  const img=insertImage(preview,true);   // 바로 화면에 표시 (반투명)
  try{await processImage(img,file,noteId)}finally{URL.revokeObjectURL(preview)}
}
async function uploadRemote(src){
  if(!src||!currentNote)return;
  const noteId=currentNote.id;
  const img=insertImage(src,true);
  await processImage(img,src,noteId);
}
async function uploadImages(e){
  const files=[...e.target.files];e.target.value='';
  await Promise.all(files.map(f=>uploadBlob(f)));  // 동시에 업로드, 미리보기는 순서대로 삽입
}

/* ---------- 붙여넣기: 글자는 순수 텍스트로, 이미지는 업로드 ---------- */
function insertPlainText(text){
  const body=document.getElementById('bodyEditor');if(!body||!text)return;
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const html=lines.map(l=>l?`<div>${esc(l)}</div>`:'<div><br></div>').join('');
  body.focus();restoreRange();
  let ok=false;
  try{ok=document.execCommand('insertHTML',false,html)}catch{}
  if(!ok)try{ok=document.execCommand('insertText',false,text)}catch{}
  // 커서 위치를 바로 갱신 (selectionchange는 비동기라, 안 하면 다음 사진이 글자 '앞'에 들어감)
  const s=getSelection();
  if(s.rangeCount&&body.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange();
}
function parseHtmlClip(html){
  // 이미지가 섞인 HTML을 [글자, 이미지, 글자…] 순서로 풀어냄 (빈 줄도 유지)
  const d=new DOMParser().parseFromString(html,'text/html');
  const parts=[];let buf='';
  const flush=()=>{
    if(buf)parts.push({t:buf.replace(/\n$/,'')});   // 블록 끝의 줄바꿈 하나만 제거
    buf='';
  };
  const block=/^(P|DIV|LI|TR|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TABLE|SECTION|ARTICLE|FIGURE)$/;
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType===3){
        const t=c.nodeValue.replace(/\s+/g,' ');
        if(t===' '&&(!buf||buf.endsWith('\n')))continue;   // 태그 사이 공백 무시
        buf+=t;
      }else if(c.nodeType===1){
        const tag=c.tagName;
        if(tag==='STYLE'||tag==='SCRIPT'||tag==='META')continue;
        if(tag==='IMG'){
          flush();const src=c.getAttribute('src');
          if(src)parts.push({img:src,small:c.hasAttribute('class')?c.classList.contains('small'):true});
          continue;
        }
        if(tag==='BR'){buf+='\n';continue}
        const isBlock=block.test(tag);
        if(isBlock&&buf&&!buf.endsWith('\n'))buf+='\n';   // 맨 앞 글자 뒤에 블록이 와도 줄이 합쳐지지 않게
        walk(c);
        if(isBlock&&buf&&!buf.endsWith('\n'))buf+='\n';
      }
    }
  })(d.body);
  flush();
  return parts.filter(p=>p.img||p.t!==undefined);
}
function lineHasContent(node){
  if(node.querySelector&&node.querySelector('img'))return true;
  return !!(node.textContent||'').replace(/[​\s]/g,'');
}
// 줄(div) 묶음을 커서 위치에 순서대로 한 번에 넣음
function insertBlocks(blocks){
  const body=document.getElementById('bodyEditor');if(!body||!blocks.length)return;
  body.focus();
  const sel=getSelection();
  let r=null;
  if(sel.rangeCount&&body.contains(sel.anchorNode))r=sel.getRangeAt(0);
  else if(savedRange&&body.contains(savedRange.startContainer))r=savedRange.cloneRange();
  if(!r){r=document.createRange();r.selectNodeContents(body);r.collapse(false)}
  if(!r.collapsed)r.deleteContents();
  const sc=r.startContainer,so=r.startOffset;
  let ref=null;
  if(sc===body){ref=body.childNodes[so]||null}
  else{
    let line=sc;while(line.parentNode!==body)line=line.parentNode;
    if(line.nodeType!==1){const w=document.createElement('div');body.insertBefore(w,line);w.appendChild(line);line=w}
    const pre=document.createRange();pre.setStart(line,0);pre.setEnd(sc,so);
    const post=document.createRange();post.setStart(sc,so);post.setEnd(line,line.childNodes.length);
    const hasPre=lineHasContent(pre.cloneContents()),hasPost=lineHasContent(post.cloneContents());
    if(!hasPre&&!hasPost){ref=line.nextSibling;line.remove()}      // 빈 줄이면 그 자리를 대체
    else if(!hasPre){ref=line}                                      // 줄 맨 앞
    else if(!hasPost){ref=line.nextSibling}                         // 줄 맨 뒤
    else{const d=document.createElement('div');d.appendChild(post.extractContents());ref=line.nextSibling;body.insertBefore(d,ref);ref=d}
  }
  blocks.forEach(b=>body.insertBefore(b,ref));
  const last=blocks[blocks.length-1];
  let cur=last;
  if(last.querySelector('img')){        // 사진으로 끝나면 아래에 글 쓸 빈 줄 확보
    const nx=last.nextSibling;
    if(nx&&nx.nodeType===1&&nx.tagName==='DIV'&&!lineHasContent(nx))cur=nx;
    else{const d=document.createElement('div');d.innerHTML='<br>';body.insertBefore(d,nx);cur=d}
  }
  const nr=document.createRange();
  if(cur.lastChild&&cur.lastChild.nodeType===3)nr.setStart(cur.lastChild,cur.lastChild.length);else nr.setStart(cur,0);
  nr.collapse(true);
  sel.removeAllRanges();sel.addRange(nr);savedRange=nr.cloneRange();
  normalizeLines(body);
  try{cur.scrollIntoView({block:'nearest'})}catch{}
}
// [글자, 사진, 글자…] 를 원래 순서/줄 그대로 붙여넣기 (연속된 사진은 한 줄에 같이)
function insertParts(parts){
  const noteId=currentNote?.id;
  const blocks=[],pending=[];
  let imgBlock=null;
  for(const p of parts){
    if(p.img){
      if(!imgBlock){imgBlock=document.createElement('div');blocks.push(imgBlock)}
      const im=document.createElement('img');
      im.src=p.img;im.alt='사진';im.setAttribute('data-uploading','1');
      if(p.small!==false)im.classList.add('small');
      imgBlock.appendChild(im);pending.push([im,p.img]);
    }else{
      imgBlock=null;
      p.t.replace(/\r\n?/g,'\n').split('\n').forEach(l=>{
        const d=document.createElement('div');
        l=l.replace(/^ +| +$/g,'');
        if(l)d.textContent=l;else d.innerHTML='<br>';
        blocks.push(d);
      });
    }
  }
  insertBlocks(blocks);
  scheduleSave();
  pending.forEach(([im,src])=>processImage(im,src,noteId));
}
function handlePaste(e){
  const cd=e.clipboardData;if(!cd)return;
  e.preventDefault();               // 원본 서식/base64 이미지가 그대로 들어가 저장이 터지는 걸 방지
  let files=[...(cd.files||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length)files=[...(cd.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  const html=cd.getData('text/html')||'';
  const text=cd.getData('text/plain')||'';
  if(files.length){
    if(text.trim())insertPlainText(text);
    files.forEach(f=>uploadBlob(f));
    return;
  }
  if(html&&/<img[\s>]/i.test(html)){
    const parts=parseHtmlClip(html);
    if(parts.some(p=>p.img)){insertParts(parts);return}
  }
  insertPlainText(text);
}

/* ---------- 노트 열기/저장 ---------- */
function createNote(){
  const ref=doc(collection(db,'notes'));
  editorOpen=true;
  currentNote={id:ref.id,isNew:true,title:'',content:'',pinned:false,images:[],folderId:(trashMode||currentFolderId==='all')?null:currentFolderId};
  editorHTML(currentNote);
}
function openNote(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  editorOpen=true;
  let content=n.content||'';
  const t=(n.title||'').trim();
  if(t&&firstLine(content)!==t)content=`<div>${esc(t)}</div>`+content;   // 예전 제목은 첫 줄로 옮김
  currentNote={id:n.id,isNew:false,title:n.title||'',content,pinned:!!n.pinned,images:n.images||[],folderId:n.folderId||null};
  editorHTML(currentNote);
}
function closeEditor(){
  clearTimeout(saveTimer);
  try{hideImgMenu();saveNow()}catch(e){console.error(e)}
  currentNote=null;editorOpen=false;
  try{document.activeElement?.blur()}catch{}
  renderList();
}
function cleanContent(){
  const body=document.getElementById('bodyEditor');
  const clone=body.cloneNode(true);
  clone.querySelectorAll('img[data-uploading]').forEach(i=>i.remove());
  clone.querySelectorAll('img').forEach(i=>{if(/^(data|blob):/i.test(i.getAttribute('src')||''))i.remove()}); // 용량 초과 방지
  clone.querySelectorAll('.sel').forEach(el=>{el.classList.remove('sel');if(!el.getAttribute('class'))el.removeAttribute('class')});
  return{html:clone.innerHTML,images:[...clone.querySelectorAll('img')].map(i=>i.getAttribute('src'))};
}
function saveNow(){
  const n=currentNote;
  const bodyEl=document.getElementById('bodyEditor');
  if(!n||!bodyEl)return Promise.resolve();
  clearTimeout(saveTimer);
  const{html,images}=cleanContent();const title=firstLine(html);
  n.title=title;n.content=html;n.images=images;
  const pendingImgs=bodyEl.querySelectorAll('img[data-uploading]').length;   // 업로드 중인 사진이 있으면 빈 메모여도 저장
  if(n.isNew&&!title.trim()&&!plainText(html)&&!images.length&&!pendingImgs)return Promise.resolve(); // 빈 새 메모는 저장 안 함
  if(html.length>900000){toast('메모가 너무 길어서 저장할 수 없어요');const st=document.getElementById('saveState');if(st)st.textContent='저장 실패';return Promise.resolve()}
  const data={title,content:html,pinned:!!n.pinned,images,folderId:n.folderId||null,updatedAt:serverTimestamp()};
  if(n.isNew){data.createdAt=serverTimestamp();n.isNew=false}
  // 목록에 즉시 반영
  const i=notes.findIndex(x=>x.id===n.id);
  const merged={...(i>=0?notes[i]:{createdAt:new Date(),deletedAt:null}),id:n.id,title,content:html,pinned:!!n.pinned,images,folderId:n.folderId||null,updatedAt:new Date()};
  if(i>=0)notes[i]=merged;else notes.push(merged);
  const state=document.getElementById('saveState');if(state)state.textContent='저장 중…';
  return setDoc(doc(db,'notes',n.id),data,{merge:true}).then(()=>{
    const s=document.getElementById('saveState');if(s&&currentNote?.id===n.id)s.textContent='저장됨';
  }).catch(e=>{
    console.error(e);toast('저장에 실패했어요');
    const s=document.getElementById('saveState');if(s)s.textContent='저장 실패';
  });
}
function scheduleSave(){
  const s=document.getElementById('saveState');if(s)s.textContent='작성 중…';
  clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500);
}
async function togglePin(){
  currentNote.pinned=!currentNote.pinned;
  document.getElementById('pinBtn').textContent=currentNote.pinned?'📌':'📍';
  await saveNow();
}
async function removeCurrent(){
  if(!currentNote)return;
  if(!confirm('이 메모를 휴지통으로 이동할까요?'))return;
  clearTimeout(saveTimer);hideImgMenu();
  saveNow();
  const n=currentNote;currentNote=null;editorOpen=false;
  if(!n.isNew){
    const x=notes.find(v=>v.id===n.id);if(x)x.deletedAt=new Date();
    setDoc(doc(db,'notes',n.id),{deletedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true}).catch(e=>{console.error(e);toast('삭제에 실패했어요')});
  }
  renderList();
}

/* 앱이 백그라운드로 가거나 닫힐 때 마지막 내용 저장 */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&currentNote)saveNow()});
window.addEventListener('pagehide',()=>{if(currentNote)saveNow()});

/* ---------- 실시간 구독 (orderBy 제거: 필드 없는 문서가 누락되는 문제 방지) ---------- */
onSnapshot(collection(db,'notes'),snap=>{
  notes=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(!editorOpen)renderList();
},err=>{console.error('notes listener:',err);toast('메모 목록을 불러오지 못했어요')});

onSnapshot(collection(db,'folders'),snap=>{
  folders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));
  if(!editorOpen)renderList();
},err=>console.error('folders listener:',err));

setLoading(false);
renderList();
</script>
